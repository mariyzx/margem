services:
  postgres:
    image: postgres:17-alpine
    container_name: margem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-margem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-margem_dev}
      POSTGRES_DB: ${POSTGRES_DB:-margem}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - margem_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-margem} -d ${POSTGRES_DB:-margem}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - margem_local

  redis:
    image: redis:7.4-alpine
    container_name: margem-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-margem_redis_dev}",
        "--appendonly",
        "yes",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - margem_redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=${REDIS_PASSWORD:-margem_redis_dev} redis-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - margem_local

  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: margem-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1025"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - margem_local

volumes:
  margem_postgres_data:
  margem_redis_data:

networks:
  margem_local:
    driver: bridge
