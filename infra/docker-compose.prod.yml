# Every container logs through the `local` driver, capped at 5 files x 10 MB, so an
# attack that floods the access log cannot fill the VPS disk.
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      # Directory mount (not a single file): git replaces files with a new inode on
      # pull, and a single-file bind mount would keep serving the old content.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - edge

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      # Read by the Next standalone server.js (ms). Must outlive Caddy's upstream
      # keepalive (60s in infra/caddy/Caddyfile); Node's default of 5s caused 502s.
      KEEP_ALIVE_TIMEOUT: ${WEB_KEEP_ALIVE_TIMEOUT:-65000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    networks:
      - edge

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      API_PORT: 3001
      APP_URL: ${APP_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      MAGIC_LINK_DAILY_CAP: ${MAGIC_LINK_DAILY_CAP:-300}
      MAX_ACTIVE_SESSIONS_PER_USER: ${MAX_ACTIVE_SESSIONS_PER_USER:-10}
      MAX_NOTEBOOKS_PER_USER: ${MAX_NOTEBOOKS_PER_USER:-100}
      MAX_NOTES_PER_USER: ${MAX_NOTES_PER_USER:-5000}
      MAX_SOURCES_PER_USER: ${MAX_SOURCES_PER_USER:-500}
      MAX_SOURCE_STORAGE_MB_PER_USER: ${MAX_SOURCE_STORAGE_MB_PER_USER:-500}
      MAX_QUESTIONS_PER_USER: ${MAX_QUESTIONS_PER_USER:-10000}
      MAX_PRACTICE_ITEMS_PER_USER: ${MAX_PRACTICE_ITEMS_PER_USER:-10000}
      # Required: the API refuses to start in production without it (see apps/api/src/config/env.ts).
      LOG_HASH_SECRET: ${LOG_HASH_SECRET:?LOG_HASH_SECRET must be set (openssl rand -hex 32)}
      # Required: master key of users' AI keys (AES-256-GCM). Losing it makes every stored key unreadable.
      AI_KEYS_MASTER_KEY: ${AI_KEYS_MASTER_KEY:?AI_KEYS_MASTER_KEY must be set (openssl rand -base64 32)}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # The API only needs the upload bucket; BACKUP_S3_* stay with the backup script.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-sa-saopaulo-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_ENABLED: ${OLLAMA_CHAT_ENABLED:-false}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CONTEXT_TOKENS: ${OLLAMA_CONTEXT_TOKENS:-8192}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-google/gemma-4-31b-it:free}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  ollama:
    image: ollama/ollama:0.6.5
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_TOKENS:-8192}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${OLLAMA_CPUS:-0.5}
          memory: ${OLLAMA_MEMORY:-1g}
    networks:
      - internal

  ollama-models:
    image: ollama/ollama:0.6.5
    profiles: ["tools"]
    environment:
      OLLAMA_CHAT_ENABLED: ${OLLAMA_CHAT_ENABLED:-false}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve & server=$$!;
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull "$$OLLAMA_EMBED_MODEL" &&
        if [ "$$OLLAMA_CHAT_ENABLED" = "true" ]; then ollama pull "$$OLLAMA_CHAT_MODEL";
        else ollama rm "$$OLLAMA_CHAT_MODEL" >/dev/null 2>&1; true; fi; status=$$?;
        kill $$server; exit $$status
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - models_egress

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
  models_egress:
    driver: bridge
