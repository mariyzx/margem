name: Semgrep

on:
  push:
    branches: ["main", "epic/**"]
  pull_request:
    branches: ["main", "epic/**"]

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Semgrep
        run: semgrep scan --config p/typescript --config p/owasp-top-ten --error
