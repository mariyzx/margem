name: Semgrep

on:
  push:
    branches: ["main", "epic/**"]
  pull_request:
    branches: ["main", "epic/**"]

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config p/typescript --config p/owasp-top-ten --error
