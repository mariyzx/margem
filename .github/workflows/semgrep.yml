name: Semgrep

on:
  push:
    branches: ["main", "epic/**"]
  pull_request:
    branches: ["main", "epic/**"]

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        run: semgrep scan --config p/typescript --config p/owasp-top-ten --error
